<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sieve Script Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="editor-container">
    <div class="toolbar">
      <div class="toolbar-left">
        <label for="script-name">Script:</label>
        <input type="text" id="script-name" placeholder="script name">
      </div>
      <div class="toolbar-right">
        <button id="btn-check" class="btn" title="Check syntax">Check</button>
        <button id="btn-save" class="btn btn-primary" title="Save to server">Save</button>
        <button id="btn-save-activate" class="btn btn-primary" title="Save and activate">Save &amp; Activate</button>
      </div>
    </div>

    <div class="editor-wrapper">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="editor" spellcheck="false" wrap="off"
        placeholder="# Sieve script&#10;# See RFC 5228 for the Sieve language specification&#10;&#10;require &quot;fileinto&quot;;&#10;&#10;# Example: file mailing list messages&#10;if header :contains &quot;List-Id&quot; &quot;example-list&quot; {&#10;  fileinto &quot;Lists/Example&quot;;&#10;}"></textarea>
    </div>

    <div class="statusbar">
      <span id="status-text">Ready</span>
      <span id="status-position">Ln 1, Col 1</span>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
